# mypy.ini — the type half of this package's gate, the counterpart to ruff.
#
# The same pragmatic settings as the nine sibling packages, not `--strict`:
# full signatures are required, third-party stubs are not. Copying a sibling's
# file verbatim was tempting and wrong — every comment in it recorded a defect
# that happened in *that* repository, and carrying those forward would put
# false history in a new file on day one.
[mypy]
# 3.12, not 3.10, and the reason is a dependency's stubs rather than our code.
#
# numpy >= 2.3 writes its stubs with PEP 695 `type` statements, which mypy only
# accepts from python_version 3.12. numpy is never imported here; it arrives
# through pydantic's type graph the moment `api.py` imports pydantic, and the
# failure is a *parse* of the stub, so it happens before per-module settings
# apply -- `[mypy-numpy.*] follow_imports = skip` does not help, verified on
# mypy 1.20.2 rather than assumed from a sibling's note.
#
# The cost of raising it: mypy no longer flags syntax that would break on the
# 3.10 floor. That cost is covered elsewhere -- the CI floor job installs and
# imports the package on 3.10, which is evidence rather than inference, and
# ruff keeps `target-version = "py310"`.
#
# The alternative was to leave it at 3.10 and keep the HTTP surface out of the
# check so pydantic never arrives. That buys a green gate by not checking the HTTP
# surface at all, which is the failure this suite has already paid for once:
# CI green on code nobody ran.
# audio-helper, video-helper and fastapi-mcp ship no `py.typed`, and `[dev]`
# does not pull types-PyYAML. Check this code's OWN annotations.
ignore_missing_imports = True
warn_redundant_casts = True
# Every def carries a full signature — no untyped or partially-typed functions.
disallow_untyped_defs = True
disallow_incomplete_defs = True
# warn_unused_ignores stays OFF for the same reason as everywhere else in the
# suite: with ignore_missing_imports, whether a `# type: ignore` on an optional
# import is "used" depends on whether that dependency happens to be installed,
# so it fires falsely in CI while being correct on a dev machine.

