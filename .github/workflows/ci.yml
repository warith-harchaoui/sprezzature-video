name: ci

# Gentle, deterministic gate: ruff + mypy + pytest on the supported Python
# versions. No model calls, no network, no renderer. Intentionally minimal.
#
# Nothing here renders a film. Rendering needs Node and a browser, takes tens
# of seconds per format, and is the one part of the pipeline this package does
# not own -- so CI would be spending minutes proving somebody else's tool still
# works. The tests that matter here are about claims, provenance and timing,
# and all of them run in well under a second.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A push that follows another cancels the first: without this group, two
  # commits a minute apart run two full three-version matrices to the end and
  # only the second one counts.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A stop, not a budget: without it GitHub lets a hung job run for six hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The package with every surface it advertises. Not just [dev]: without
      # [cli,api,mcp] the Click, HTTP and MCP tests all skip, and the gate goes
      # green on code nobody ran -- a failure this suite has already paid for.
      # Still cheap: the heavy backends sit behind extras none of these pull.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,mcp]"
      # Pinned, and to the same version the three ai-helpers siblings pin.
      #
      # `[dev]` asks for `ruff>=0.6`, so without this step CI took whatever
      # ruff had been released that morning -- and the gate below reads `.`,
      # the whole tree. That is a verdict hostage to somebody else's release
      # day: ruff 0.16 made Markdown code-fence formatting the default, which
      # is how `audio-helper` came to carry this same step with the same
      # comment. This package was the one repository in the suite with the
      # repo-wide format gate and no pin, so it was the one still exposed.
      #
      # Measured on 2026-10-31, both ways, so a future bump has a baseline:
      # 0.15.21 sees 21 files and 0.16.10 sees 34 -- the difference is the
      # Markdown fences -- and both declare every one of them formatted. The
      # pin is therefore not hiding a finding; it is fixing which question
      # gets asked. Bump it deliberately, not by surprise.
      - name: Install ruff
        run: pip install "ruff==0.15.21"
      - name: Ruff
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      # The type half of the gate. Once, on one version: this is a gate, not a
      # matrix.
      - name: Mypy
        if: matrix.python-version == '3.12'
        run: mypy sprezzature_video
      - name: Pytest
        run: pytest -q
