[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprezzature-video"
version = "0.4.1"
description = "Project launch films for the sprezzature stack, checked rather than rendered: every on-screen claim verified against the code it describes, every undeclared number on screen reported, and the asset tree audited for whether the film can be rendered again from a clone."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "Warith HARCHAOUI", email = "warithmetics@deraison.ai"},
]
keywords = ["video", "launch-video", "demo-video", "storyboard", "webvtt", "hyperframes", "sprezzature"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    # The one timed-text module in the suite, and the door onto ffmpeg. It is
    # not vendored here on purpose: four writers and two readers of this format
    # were consolidated once, every difference that matters here — cue
    # identifiers, line structure, voice tags — was preserved by that work, and
    # writing a fifth writer would re-open exactly what it closed.
    #
    # The consolidation lived in `sprezzature-audio` until 2026-10-31 and is in
    # `video_helper.subtitles` now. The address is the point: a caption file is
    # what a player shows over a picture, so the package that knows players
    # owns the format. This package stopped depending on the audio package for
    # a subtitle format the same day. The voice still comes from there, as a
    # base dependency since the extras were folded in on 2026-11-01.
    #
    # The floor is 2.9.0, the release that carries `subtitles`. It is also
    # where `vtt2srt` arrived, which is how a film's captions reach a platform
    # that refuses WebVTT.
    "video-helper>=2.9.0",
    # Hashing, copying and path work for the asset ledger. Declared even
    # though `audio-helper` already pulls it: `assets.py` imports it by name,
    # and a dependency you use directly but inherit transitively is exactly
    # what a clean venv turns into an ImportError nobody saw coming.
    # Plancher à 4.0.0 le 2026-11-01, et c'est une décision à deux moitiés.
    #
    # La 4.0.0 d'os-helper est une release majeure parce qu'elle a cessé de mentir :
    # `hashfile` ne rend plus de digest pour un fichier qu'il n'a pas lu (il
    # hachait le chemin en silence), un répertoire est refusé, `hashfolder` ne rend
    # plus le digest de la chaîne vide, et `date=True` prend la mtime de la cible
    # au lieu de l'heure courante. C'est exactement l'empreinte dont ce dépôt a
    # besoin : une empreinte de contenu qui échoue au lieu d'inventer.
    #
    # Et c'est devenu possible seulement maintenant : les seize paquets ai-helpers
    # plafonnaient `os-helper<4`, donc demander la 4 rendait l'installation
    # insoluble. Les seize sont republiés en `<5`, vérifié sur les métadonnées
    # PUBLIÉES (pas sur le dépôt local ni sur l'éditable installé, qui m'ont
    # trompé deux fois).
    #
    # Vérifié avant de l'écrire : cette machine exécute déjà le contrat 4.0.0 par
    # un éditable, et les onze suites de la suite y sont vertes ; et un venv vierge
    # résout `os-helper==4.0.0` avec audio 2.6.1, speaker 0.14.1, video 2.9.0,
    # standpoint 0.13.1, best-engine 1.11.1, wallet 1.3.1 et elbow 0.4.1.
    "os-helper>=4.0.0,<5",
    # Specs are YAML, like `assets/*.yaml` everywhere else in the suite, so a
    # film is a reviewable text file rather than a Python literal.
    # The command line, and the only parser since 2026-10-25.
    "click>=8.1",
    "pyyaml>=6.0",

    # ------------------------------------------------- une seule installation
    # Folded in from the extras on 2026-11-01. The base was 4
    # dependencies, so `pip install sprezzature-video` installed almost nothing and
    # did almost nothing: choosing the right extra was a thing a reader had to
    # know before the package could do its job. Across the suite that was 59
    # extras over eleven repositories, six of them with a base of one.
    #
    # The surfaces are not features and they are not optional any more: the
    # HTTP app and the MCP server are two of this package's five front doors,
    # and a door you have to install separately is a door people do not find.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fastapi-mcp>=0.3",
    "mcp<2.0",
    # Plain, and 1.9.0, since 2026-11-01. It asked for
    # the sibling with an extra while the index served 1.5.0, where that
    # extra was the real thing and the base had no voice. 1.9.0 folded
    # every extra into the base, so the name is now an empty deprecated shim
    # kept alive only for this line and its twin in the other sibling.
    #
    # The floor is load-bearing in the exact way a floor should be: on 1.5.0
    # this plain requirement would install a package that cannot speak, and
    # pip would say nothing — an unknown extra is a warning and exit 0,
    # measured, so neither spelling fails loudly on the wrong version.
    "sprezzature-audio>=1.9.0",
    "audio-helper>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # Bounded on 2026-10-31, and the reason is three lines away in this file's own
    # history: a tool resolved to "whatever is newest" is a red suite waiting for
    # somebody else's release day. mypy 2.4.1 is out, this machine has 1.20.2, and
    # a runner installs the former -- a whole major apart. It broke exactly one
    # brick (`sprezzature-figures`, an inference cycle mypy 1 guessed through and 2
    # reports), which is one more than zero and was invisible until measured.
    #
    # A floor as well as a ceiling: bare `mypy` was not even a floor, so a resolver
    # was free to reach for an ancient one. Raise the ceiling deliberately, after
    # running the new major against the tree, not by surprise.
    "mypy>=1.11,<3",
    "httpx>=0.27",
    # starlette 1.9.0 moved its TestClient onto httpx2, and CI installs
    # `.[dev]` rather than reading requirements-dev.txt, so the
    # declaration has to be where the install actually looks.
    "httpx2>=2.0.0",
]

[project.scripts]
make-film = "sprezzature_video.cli:main"
sprezzature-video = "sprezzature_video.cli:main"
sprezzature-video-mcp = "sprezzature_video.mcp:main"

[project.urls]
Homepage = "https://sprezzature.ai/"
Repository = "https://github.com/warith-harchaoui/sprezzature-video"

[tool.setuptools]
# Only what exists. `sprezzature_video.renderers` and a `scripts/` package were
# declared here first, ahead of the modules meant to fill them -- and an empty
# directory is not a thing git carries, so they were present on the machine
# that wrote them and absent from every clone. setuptools then refused the
# build with "package directory does not exist", which is the right answer to
# a manifest describing a repository that does not exist.
#
# Add each one back in the commit that gives it a file.
packages = ["sprezzature_video"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "renders: shells out to a real renderer; skipped unless the toolchain is present",
]
# `--strict-markers` because the alternative is a marker that does nothing:
# pytest warns about an unknown mark and runs the test anyway, so a typo in
# `@pytest.mark.renders` reads as a marked test and behaves as an unmarked one.
# It cost sprezzature-accessibility seven LLM tests running in every default
# run for weeks. A guard in the hub checks all ten packages still carry it.
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM"]
ignore = [
    "E501",
    "B008",
    "SIM108",
]
